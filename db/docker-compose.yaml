services:
  db:
    image: mysql:8.0
    container_name: riocinema_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # This line maps your local SQL file into MySQL's automatic startup folder:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: